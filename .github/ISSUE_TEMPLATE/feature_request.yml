name: Feature Request
description: Suggest a new feature or improvement for MarkItDownJS
title: "[feat] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Please describe the problem you're trying to solve and your proposed solution.

  - type: dropdown
    id: package
    attributes:
      label: Affected Package(s)
      description: Which package(s) does this feature affect?
      multiple: true
      options:
        - "@markitdownjs/core"
        - "@markitdownjs/pdf"
        - "@markitdownjs/docx"
        - "@markitdownjs/xlsx"
        - "@markitdownjs/pptx"
        - "@markitdownjs/html"
        - "@markitdownjs/csv"
        - "@markitdownjs/json"
        - "@markitdownjs/xml"
        - "@markitdownjs/epub"
        - "@markitdownjs/audio"
        - "@markitdownjs/image-ocr"
        - "@markitdownjs/archive"
        - "@markitdownjs/chunking"
        - "@markitdownjs/ast"
        - "@markitdownjs/cli"
        - "@markitdownjs/api"
        - markitdownjs
        - Documentation
        - Other
    validations:
      required: false

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this feature solve? What use case does it address?
      placeholder: "I'm always frustrated when..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the API, behavior, or interface you'd like to see
      placeholder: |
        ```ts
        // Example of how you'd like to use it
        ```
      render: typescript
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: What alternative solutions or workarounds have you considered?
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Any other context, examples, or references
    validations:
      required: false
