name: Bug Report
description: Report a bug or unexpected behavior in MarkItDownJS
title: "[bug] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report! Please provide as much detail as possible.

  - type: dropdown
    id: package
    attributes:
      label: Package
      description: Which package is affected?
      multiple: false
      options:
        - "@markitdownjs/core"
        - "@markitdownjs/pdf"
        - "@markitdownjs/docx"
        - "@markitdownjs/xlsx"
        - "@markitdownjs/pptx"
        - "@markitdownjs/html"
        - "@markitdownjs/csv"
        - "@markitdownjs/json"
        - "@markitdownjs/xml"
        - "@markitdownjs/epub"
        - "@markitdownjs/audio"
        - "@markitdownjs/image-ocr"
        - "@markitdownjs/archive"
        - "@markitdownjs/chunking"
        - "@markitdownjs/ast"
        - "@markitdownjs/cli"
        - "@markitdownjs/api"
        - markitdownjs
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: What version of the package are you running?
      placeholder: e.g. 0.3.0
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node.js Version
      description: What Node.js version are you using?
      placeholder: e.g. 20.0.0
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Minimal code example to reproduce the issue
      placeholder: |
        ```ts
        import { MarkItDown } from "markitdownjs";
        const md = new MarkItDown();
        const result = await md.convert("...");
        ```
      render: typescript
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: false

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened? Include error messages and stack traces.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Any other relevant information (OS, environment, etc.)
    validations:
      required: false
